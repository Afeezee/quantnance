services:
  - type: web
    name: quantnance
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: BAYSE_PUBLIC_KEY
        sync: false
      - key: DATABASE_URL
        sync: false